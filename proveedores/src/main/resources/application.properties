server.port=${PORT_PROVEEDORES:3007}
spring.application.name=proveedores

# ---------- Base de datos ----------
# Por defecto H2 en archivo (no requiere instalar nada). Para MySQL: --spring.profiles.active=mysql
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/db/proveedores;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# El esquema lo crea y versiona Flyway (src/main/resources/db/migration). Hibernate no lo toca.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jackson.default-property-inclusion=non_null

# ---------- Seguridad (JWT) ----------
# La misma clave en los 7 servicios: usuarios firma los tokens y el resto los valida.
jwt.secreto=${JWT_SECRETO:cambia-esta-clave-en-produccion-ferreteria-los-maestros-2026}
jwt.emisor=ferreteria-los-maestros
cors.origenes=${CORS_ORIGENES:http://localhost:5173,http://localhost:4173}

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
